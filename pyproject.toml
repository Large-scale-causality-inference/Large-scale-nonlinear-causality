[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lsngc"
version = "1.0.0"
description = "Large-scale nonlinear Granger causality for multivariate time series"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{name = "Ali Vosoughi"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
demo = ["matplotlib>=3.7", "jupyter>=1", "ipykernel>=6"]

[project.urls]
Repository = "https://github.com/ali-vosoughi/Large-scale-nonlinear-causality"
Paper = "https://doi.org/10.1038/s41598-021-87316-6"
Showcase = "https://ali-vosoughi.github.io/publications/lsngc/"

[project.scripts]
lsngc = "lsngc.cli:main"

[tool.setuptools]
packages = ["lsngc", "lsngc.data"]
py-modules = ["utils", "calc_f_stat", "multivariate_split", "normalize_0_mean_1_std", "recovery_performance"]

[tool.setuptools.package-data]
lsngc = ["data/*.mat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
